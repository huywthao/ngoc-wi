<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Montserrat:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Montserrat,Arial,sans-serif}
body{color:#fff;background:#000;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-3;background:
radial-gradient(circle at 12% 14%,#fff 0 1px,transparent 2px),
radial-gradient(circle at 76% 21%,#fff 0 1px,transparent 2px),
radial-gradient(circle at 43% 69%,#fff 0 1px,transparent 2px),
radial-gradient(circle at 90% 82%,#fff 0 1px,transparent 2px),#000;
background-size:145px 165px,180px 205px,225px 240px,200px 220px}
.stars{position:fixed;inset:0;z-index:-2;pointer-events:none}
.star{position:absolute;color:#fff;text-shadow:0 0 8px #fff;opacity:.9;font-size:21px}
.big{font-size:38px}.s1{left:5%;top:8%}.s2{right:6%;top:11%}.s3{left:14%;top:35%}
.s4{right:12%;top:43%}.s5{left:5%;top:73%}.s6{right:6%;top:79%}
.s7{left:48%;top:18%}.s8{left:83%;top:58%}
.planet{position:absolute;color:#fff;opacity:.85;font-size:40px}.p1{left:3%;top:24%}.p2{right:2%;top:62%}
.wrap{width:min(92%,520px);margin:auto;padding:42px 0 55px;text-align:center}
.avatar{width:150px;height:150px;border-radius:24px;object-fit:contain;display:block;margin:8px auto 18px;border:3px solid #fff;background:#000;box-shadow:0 0 25px #ffffff2e}
h1{margin:0;font-family:"DM Serif Display",Georgia,serif;font-style:italic;font-size:clamp(48px,13vw,70px);line-height:1;text-shadow:0 0 10px #fff9}
.handle{margin:10px 0 24px;color:#ddd;font-size:14px;letter-spacing:1px}
.location{color:#ddd;font-size:14px;margin:0 0 22px}
.card{background:#ffffff12;border:1px solid #ffffff29;backdrop-filter:blur(10px);border-radius:22px;padding:10px;margin:12px 0;transition:.2s transform,.2s background}
.card:hover{transform:translateY(-3px);background:#ffffff20}
.card a{display:flex;align-items:center;justify-content:center;gap:12px;min-height:58px;color:#fff;text-decoration:none;font-weight:600;font-size:17px}
.icon{font-size:25px}
.music{margin-top:24px;padding:14px 16px;border-radius:20px;background:#ffffff12;border:1px solid #ffffff22}
.music-title{font-weight:600;font-size:15px;margin-bottom:9px}.music-sub{font-size:12px;color:#aaa;margin-bottom:10px}
.controls{display:flex;align-items:center;justify-content:center;gap:10px}
button{border:0;border-radius:999px;background:#fff;color:#000;font-weight:700;padding:12px 20px;font-size:14px;cursor:pointer}
audio{width:100%;height:38px;margin-top:10px}
.footer{margin-top:28px;color:#777;font-size:11px}
#enter{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#000f;cursor:pointer;transition:opacity .3s}
.enter-box{text-align:center;padding:30px 36px;border:1px solid #333;border-radius:22px;background:#080808}
.enter-box .play{font-size:42px}.enter-box p{margin:10px 0;color:#ddd}.enter-box small{display:block;margin-top:8px;color:#777}
@media(max-width:420px){.wrap{padding-top:34px}.avatar{width:145px;height:145px}.card a{min-height:54px}}
</style>

<script>
const enter=document.getElementById('enter');
const audio=document.getElementById('audio');
const playBtn=document.getElementById('playBtn');
const status=document.getElementById('status');

async function playMusic(){
  audio.muted=false;
  audio.volume=1;
  try{
    await audio.play();
    playBtn.textContent='❚❚ Tạm dừng';
    status.textContent='Đang phát nhạc';
  }catch(e){
    status.textContent='Chrome đang chặn tự phát — bấm ▶ Phát nhạc';
    playBtn.textContent='▶ Phát nhạc';
  }
}
function pauseMusic(){
  audio.pause();
  playBtn.textContent='▶ Phát nhạc';
  status.textContent='Đã tạm dừng';
}

enter.addEventListener('click', async ()=>{
  enter.style.opacity='0';
  setTimeout(()=>enter.remove(),300);
  await playMusic();
});
playBtn.addEventListener('click', async ()=>{
  if(audio.paused) await playMusic(); else pauseMusic();
});
audio.addEventListener('play',()=>{playBtn.textContent='❚❚ Tạm dừng';status.textContent='Đang phát nhạc'});
audio.addEventListener('pause',()=>{playBtn.textContent='▶ Phát nhạc'});
</script>
